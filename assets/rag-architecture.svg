<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L7 3 Z" fill="#59867a"/></marker></defs><rect width="1200" height="640" fill="#eff4ed"/><text x="48" y="65" font-family="Arial, sans-serif" font-size="31" fill="#1e3444" font-weight="600">RAG Research Assistant</text><text x="48" y="104" font-family="Arial, sans-serif" font-size="18" fill="#587068" font-weight="400">From research papers to answers with traceable sources</text><rect x="48" y="160" width="310" height="150" rx="14" fill="white" stroke="#cad9d0"/><text x="70" y="200" font-family="Arial, sans-serif" font-size="21" fill="#1e3444" font-weight="600">1. Index the paper</text><text x="70" y="236" font-family="Arial, sans-serif" font-size="17" fill="#566d72" font-weight="400">PDF upload · /upload</text><text x="70" y="263" font-family="Arial, sans-serif" font-size="17" fill="#566d72" font-weight="400">Chunk and embed the text</text><rect x="445" y="160" width="310" height="150" rx="14" fill="white" stroke="#cad9d0"/><text x="467" y="200" font-family="Arial, sans-serif" font-size="21" fill="#1e3444" font-weight="600">2. Store the context</text><text x="467" y="236" font-family="Arial, sans-serif" font-size="17" fill="#566d72" font-weight="400">Persistent ChromaDB</text><text x="467" y="263" font-family="Arial, sans-serif" font-size="17" fill="#566d72" font-weight="400">Page and source metadata</text><rect x="842" y="160" width="310" height="150" rx="14" fill="white" stroke="#cad9d0"/><text x="864" y="200" font-family="Arial, sans-serif" font-size="21" fill="#1e3444" font-weight="600">3. Retrieve evidence</text><text x="864" y="236" font-family="Arial, sans-serif" font-size="17" fill="#566d72" font-weight="400">Question · /query</text><text x="864" y="263" font-family="Arial, sans-serif" font-size="17" fill="#566d72" font-weight="400">Cosine-similarity retrieval</text><path d="M365 235 L437 235" fill="none" stroke="#59867a" stroke-width="3" marker-end="url(#arrow)"/><path d="M762 235 L834 235" fill="none" stroke="#59867a" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="370" width="390" height="150" rx="14" fill="white" stroke="#cad9d0"/><text x="172" y="410" font-family="Arial, sans-serif" font-size="21" fill="#1e3444" font-weight="600">Grounded answer</text><text x="172" y="446" font-family="Arial, sans-serif" font-size="17" fill="#566d72" font-weight="400">Retrieved context + language model</text><text x="172" y="473" font-family="Arial, sans-serif" font-size="17" fill="#566d72" font-weight="400">Answer with page-level citations</text><rect x="650" y="370" width="390" height="150" rx="14" fill="white" stroke="#cad9d0"/><text x="672" y="410" font-family="Arial, sans-serif" font-size="21" fill="#1e3444" font-weight="600">API engineering</text><text x="672" y="446" font-family="Arial, sans-serif" font-size="17" fill="#566d72" font-weight="400">FastAPI · Docker · pytest</text><text x="672" y="473" font-family="Arial, sans-serif" font-size="17" fill="#566d72" font-weight="400">Mocked external model calls</text><path d="M997 318 L997 347" fill="none" stroke="#59867a" stroke-width="3" marker-end="url(#arrow)"/><path d="M997 347 L347 347" fill="none" stroke="#59867a" stroke-width="3" marker-end="url(#arrow)"/><path d="M347 347 L347 362" fill="none" stroke="#59867a" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="606" font-family="Arial, sans-serif" font-size="16" fill="#587068" font-weight="400">Architecture illustration based on the public project repository.</text></svg>